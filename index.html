<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل جبلة السياحي</title>
<style>
  :root{
    --gold:#b8935a;
    --dark:#1c2b3a;
    --bg:#f5f1e8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(180deg,var(--dark) 0%, #0f1a24 100%);
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 40px;
  }
  header{
    text-align:center;
    color:#f2e6cf;
    margin-bottom:18px;
  }
  header h1{
    font-size:1.6rem;
    margin:6px 0 2px;
    color:var(--gold);
  }
  header p{
    margin:0;
    font-size:0.95rem;
    color:#cfc3a8;
  }
  .viewer-wrap{
    width:100%;
    max-width:820px;
    background:#fff;
    border:2px solid var(--gold);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
  }
  .viewer-wrap embed, .viewer-wrap iframe{
    width:100%;
    height:80vh;
    border:none;
    display:block;
  }
  .fallback{
    padding:40px 20px;
    text-align:center;
    color:#333;
  }
  .actions{
    margin-top:20px;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:12px 26px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    font-size:1rem;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary{
    background:var(--gold);
    color:#1c2b3a;
  }
  .btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(184,147,90,0.4);
  }
  footer{
    margin-top:28px;
    color:#8a8065;
    font-size:0.8rem;
    text-align:center;
  }
</style>
</head>
<body>
  <header>
    <h1>دليل جبلة السياحي</h1>
    <p>مدينة البحر والتاريخ والضيافة</p>
  </header>

  <div class="viewer-wrap">
    <embed src="Jableh_Tourist_Guide.pdf" type="application/pdf">
    <div class="fallback">
      متصفحك ما بيدعم عرض الـPDF مباشرة.
      <br>
      <a class="btn btn-primary" style="margin-top:12px;" href="Jableh_Tourist_Guide.pdf" download>تحميل الملف</a>
    </div>
  </div>

  <div class="actions">
    <a class="btn btn-primary" href="Jableh_Tourist_Guide.pdf" download>⬇ تحميل الكتاب PDF</a>
  </div>

  <footer>رابطة محبي مدينة جبلة</footer>
</body>
</html>
